name: Update Sitemap & Feed

on:
  push:
    branches:
      - main   # change this to "master" if that's your default branch
    paths-ignore:
      - 'sitemap.xml'   # prevents an infinite loop when the bot commits the sitemap
      - 'feed.xml'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    # Let the workflow push commits back to the repo
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: python3 generate_sitemap.py

      - name: Generate feed.xml
        run: python3 generate_feed.py

      - name: Commit and push if sitemap or feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No changes to sitemap.xml or feed.xml"
          else
            git commit -m "Auto-update sitemap.xml and feed.xml"
            git pull --rebase origin main
            git push
          fi
