name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install pytest

      - name: HTML contract tests (metadata, affiliate links, schema, links)
        run: pytest tests/

      - name: style.css matches src/ (no hand-edits, no stale build)
        run: |
          bash build.sh
          git diff --exit-code style.css

      - name: Every class used in HTML resolves in style.css
        run: python3 check-classes.py

      - name: sitemap.xml covers every .html file on disk
        run: |
          cp sitemap.xml /tmp/sitemap.before.xml
          python3 generate_sitemap.py
          # Compare URL sets only — lastmod is expected to change every run
          # and is kept current by the separate update-sitemap workflow.
          grep -o '<loc>[^<]*</loc>' /tmp/sitemap.before.xml | sort > /tmp/before.urls
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sort > /tmp/after.urls
          diff -u /tmp/before.urls /tmp/after.urls

  browser-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (dark mode, toggle, console errors, mobile layout)
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
